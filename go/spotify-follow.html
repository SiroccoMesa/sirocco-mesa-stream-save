<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow Sirocco Mesa on Spotify</title>
<meta name="description" content="Follow Sirocco Mesa on Spotify.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://siroccomesa.github.io/sirocco-mesa-stream-save/go/spotify-follow.html">
<meta http-equiv="refresh" content="0;url=https://open.spotify.com/artist/5d0U1202iintbVDJp7cGpa">
<style>
:root { --text:#f8f3ea; --muted:#c9c0b5; --accent:#f0c98c; }
body {
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  font-family:Arial,Helvetica,sans-serif;
  background:#111;
  color:var(--text);
  padding:28px 16px;
}
main { width:min(100%,560px); text-align:center; }
h1 { margin:0 0 12px; font-size:clamp(28px,6vw,40px); letter-spacing:.04em; }
p { margin:0 0 16px; color:var(--muted); line-height:1.5; }
a {
  color:var(--accent);
  font-weight:800;
  text-underline-offset:3px;
}
</style>
<script>
(function () {
  var base = "https://open.spotify.com/artist/5d0U1202iintbVDJp7cGpa";
  var src = "";
  try {
    src = new URLSearchParams(location.search).get("src") || "";
  } catch (e) {}
  if (src && !/^[A-Za-z0-9_-]{1,80}$/.test(src)) src = "";
  if (src) {
    try { sessionStorage.setItem("siroccoMesaSrc", src); } catch (e) {}
  }
  var dest = src ? base + "?src=" + encodeURIComponent(src) : base;
  var meta = document.querySelector('meta[http-equiv="refresh"]');
  if (meta) meta.setAttribute("content", "0;url=" + dest);
  document.addEventListener("DOMContentLoaded", function () {
    var link = document.getElementById("continue");
    if (link) link.setAttribute("href", dest);
  });
  location.replace(dest);
})();
</script>
<script data-goatcounter="https://siroccomesa.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<main>
  <h1>Follow Sirocco Mesa on Spotify</h1>
  <p><a id="continue" href="https://open.spotify.com/artist/5d0U1202iintbVDJp7cGpa" rel="nofollow noopener noreferrer">Follow Sirocco Mesa on Spotify</a></p>
</main>
</body>
</html>
